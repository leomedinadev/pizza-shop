plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
}
ext {
	dependenciesManagementPluginVersion         = '1.1.4'
	springBootVersion                           = '3.2.3'
	springVersion                               = '5.2.6.RELEASE'
	gradleLombokVersion 						= '1.18.30'
	springSecurity								= '6.2.2'
	pizzaShopVersion 							= '1.1.0-SNAPSHOT'
}

group = 'ec.com.leodev.pizzashop'
version = '1.1.0-SNAPSHOT'
// sourceCompatibility = '17'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"
	implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
	implementation "org.springframework.boot:spring-boot-starter-security:${springBootVersion}"
	implementation "com.auth0:java-jwt:4.3.0"
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'
	compileOnly "org.projectlombok:lombok:${gradleLombokVersion}"
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor "org.projectlombok:lombok:${gradleLombokVersion}"
	testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
	testImplementation "org.springframework.security:spring-security-test:${springSecurity}"
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly "org.projectlombok:lombok:${gradleLombokVersion}"
	testAnnotationProcessor "org.projectlombok:lombok:${gradleLombokVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
}
